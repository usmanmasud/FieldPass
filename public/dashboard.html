<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FieldPass Dashboard</title>
  <link rel="icon" href="/logo.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .stat b { display: block; font-size: 26px; }
    .stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .stat.standing b { color: var(--standing); } .stat.open b { color: var(--open); } .stat.booked b { color: var(--booked); } .stat.danger b { color: var(--danger); }
    .row { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 14px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    @media (max-width: 900px) { .row, .row2 { grid-template-columns: 1fr; } }
    #map { height: 460px; border-radius: 8px; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; margin-top: 8px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    form.inline { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    form.inline input { width: 120px; flex: 1; }
    .incident { border-left: 3px solid var(--danger); padding: 6px 10px; margin-bottom: 8px; background: #fbf3f1; border-radius: 0 8px 8px 0; font-size: 13px; }
    .incident.resolved { border-color: var(--harvested); background: #f4f3f0; }
    .incident button { padding: 3px 8px; font-size: 12px; float: right; }
  </style>
</head>
<body>
<header class="top">
  <img src="/logo.svg" alt="">
  <div><h1>FieldPass</h1><small>Ward dashboard</small></div>
  <nav><a href="/">Home</a><a href="/simulator">Phone simulator</a></nav>
</header>
<main>
  <div class="toolbar">
    <button id="run-jobs" class="ghost">Send due reminders</button>
    <button id="seed" class="ghost">Load demo season</button>
    <span id="toast" class="muted"></span>
  </div>

  <div class="stats" id="stats"></div>

  <div class="row">
    <div class="panel">
      <h2>Field map</h2>
      <div id="map"></div>
      <div class="legend">
        <span><i style="background:var(--standing)"></i>Standing - keep herds out</span>
        <span><i style="background:var(--open)"></i>Open for grazing</span>
        <span><i style="background:var(--booked)"></i>Booked</span>
        <span><i style="background:var(--harvested)"></i>Harvested / closed</span>
        <span><i style="background:transparent;border:2px solid var(--danger)"></i>Damage report</span>
      </div>
    </div>
    <div class="panel">
      <h2>Damage reports</h2>
      <div id="incidents" class="scroll" style="max-height:480px"></div>
    </div>
  </div>

  <div class="row2">
    <div class="panel"><h2>Grazing deals</h2><div class="scroll"><table id="bookings"></table></div></div>
    <div class="panel"><h2>Outbound SMS / airtime / calls</h2><div class="scroll"><table id="messages"></table></div></div>
  </div>

  <div class="row2">
    <div class="panel">
      <h2>Mediators (alerted on damage)</h2>
      <table id="mediators"></table>
      <form class="inline" id="mediator-form">
        <input name="name" placeholder="Name" required>
        <input name="phone" placeholder="Phone" required>
        <input name="role" placeholder="Role (Ardo, village head...)">
        <select name="ward_id" id="mediator-ward"><option value="">All wards</option></select>
        <button>Add</button>
      </form>
    </div>
    <div class="panel">
      <h2>Wards</h2>
      <div class="scroll" style="max-height:220px"><table id="wards"></table></div>
      <form class="inline" id="ward-form">
        <input name="code" placeholder="Code" required style="max-width:80px">
        <input name="name" placeholder="Ward" required>
        <input name="lga" placeholder="LGA" required>
        <input name="lat" placeholder="Lat" style="max-width:90px">
        <input name="lng" placeholder="Lng" style="max-width:90px">
        <button>Add</button>
      </form>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS = { standing: '#c97a12', open: '#2f8f4e', booked: '#2b62c4', harvested: '#8a857a', closed: '#8a857a' };
const CROP = { sorghum: 'Sorghum', millet: 'Millet', maize: 'Maize', groundnut: 'Groundnut', cowpea: 'Cowpea', rice: 'Rice' };
const KIND = { standing_crop: 'Cattle in standing crop', during_booking: 'Damage during agreed grazing', stored_produce: 'Stored produce eaten', other: 'Other damage' };
const TERMS = (f) => f.terms === 'free' ? 'Free' : f.terms === 'manure' ? 'Manure swap' : f.terms === 'price' ? `N${f.price}/day` : '';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pill = (s) => `<span class="pill s-${esc(s)}">${esc(s)}</span>`;
const phone = (p) => (p || '').replace(/^\+234/, '0');
const $ = (id) => document.getElementById(id);

const map = L.map('map', { scrollWheelZoom: false }).setView([12.0, 8.52], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '&copy; OpenStreetMap' }).addTo(map);
const layer = L.layerGroup().addTo(map);
let fitted = false;

// Feature phones give no GPS, so fields are placed around their ward centre.
function fieldPos(f) {
  const a = f.id * 2.39996, r = 0.008 + (f.id % 5) * 0.005;
  return [f.lat + Math.sin(a) * r, f.lng + Math.cos(a) * r];
}

function render(d) {
  const s = d.stats;
  $('stats').innerHTML = [
    ['standing', s.standing, 'Standing fields'], ['open', s.open, 'Open for grazing'], ['booked', s.booked, 'Herds on fields'],
    ['', s.dealsCompleted, 'Peaceful deals'], ['danger', s.openIncidents, 'Open damage reports'],
    ['', `${s.farmers} / ${s.herders}`, 'Farmers / herders'], ['', `N${s.airtime}`, 'Airtime rewarded'],
  ].map(([c, v, l]) => `<div class="stat ${c}"><b>${esc(v)}</b><span>${l}</span></div>`).join('');

  layer.clearLayers();
  const pts = [];
  for (const w of d.wards) {
    if (w.lat == null) continue;
    pts.push([w.lat, w.lng]);
    L.circle([w.lat, w.lng], { radius: 3500, color: '#1f5135', weight: 1, fillOpacity: 0.04 })
      .bindTooltip(`<b>${esc(w.name)}</b> (${esc(w.code)}) - ${esc(w.lga)}<br>${w.open} open, ${w.standing} standing`).addTo(layer);
  }
  const byId = {};
  for (const f of d.fields) {
    if (f.lat == null) continue;
    byId[f.id] = f;
    L.circleMarker(fieldPos(f), { radius: 7, color: '#fff', weight: 1.5, fillColor: COLORS[f.status], fillOpacity: 0.95 })
      .bindPopup(`<b>Field #${f.id}</b> - ${CROP[f.crop] || f.crop}<br>${esc(f.ward_name)}, near ${esc(f.landmark)}<br>
        Farmer: ${esc(f.farmer_name)} ${phone(f.farmer_phone)}<br>Status: ${pill(f.status)}
        ${f.status === 'standing' ? `<br>Harvest ~${f.expected_harvest}` : ''}
        ${f.status === 'open' ? `<br>${TERMS(f)}, from ${f.open_from} for ${f.open_days} days` : ''}`).addTo(layer);
  }
  for (const i of d.incidents) {
    const f = byId[i.field_id];
    if (!f) continue;
    L.circleMarker(fieldPos(f), { radius: 13, color: i.status === 'open' ? '#c73a2e' : '#b9b3a6', weight: 2.5, fill: false })
      .bindTooltip(`INC-${i.id}: ${KIND[i.kind]}`).addTo(layer);
  }
  if (!fitted && pts.length) { map.fitBounds(pts, { padding: [30, 30] }); fitted = true; }

  $('incidents').innerHTML = d.incidents.length ? d.incidents.map((i) => `
    <div class="incident ${i.status}">
      ${i.status === 'open' ? `<button data-resolve="${i.id}">Resolved</button>` : pill('resolved')}
      <b>INC-${i.id}</b> ${KIND[i.kind]}<br>
      Field #${i.field_id} (${CROP[i.crop]}), ${esc(i.ward_name)} - ${i.occurred_on}<br>
      <span class="muted">by ${esc(i.reporter_name)} ${phone(i.reporter_phone)}${i.booking_id ? ` - booking #${i.booking_id}` : ''}</span>
    </div>`).join('') : '<p class="muted">No damage reported.</p>';

  $('bookings').innerHTML = '<tr><th>Code</th><th>Field</th><th>Herder</th><th>Dates</th><th>Status</th></tr>' + d.bookings.map((b) => `
    <tr><td>${b.code}</td><td>#${b.field_id} ${CROP[b.crop]}, ${esc(b.ward_name)}<br><span class="muted">${esc(b.farmer_name)}</span></td>
    <td>${esc(b.herder_name)}<br><span class="muted">${phone(b.herder_phone)}</span></td><td>${b.start_date}<br>${b.end_date}</td><td>${pill(b.status)}</td></tr>`).join('');

  $('messages').innerHTML = '<tr><th>When</th><th>To</th><th>Message</th><th></th></tr>' + d.messages.map((m) => `
    <tr><td class="muted">${m.created_at.slice(5, 16)}</td><td>${m.channel}<br>${phone(m.recipient)}</td><td>${esc(m.body)}</td><td>${pill(m.status)}</td></tr>`).join('');

  $('mediators').innerHTML = '<tr><th>Name</th><th>Phone</th><th>Covers</th><th></th></tr>' + d.mediators.map((m) => `
    <tr><td>${esc(m.name)}<br><span class="muted">${esc(m.role)}</span></td><td>${phone(m.phone)}</td><td>${esc(m.ward_name || 'All wards')}</td>
    <td><button class="ghost" data-del-mediator="${m.id}">x</button></td></tr>`).join('');

  $('wards').innerHTML = '<tr><th>Code</th><th>Ward</th><th>LGA</th><th>Open</th><th>Standing</th></tr>' + d.wards.map((w) => `
    <tr><td>${esc(w.code)}</td><td>${esc(w.name)}</td><td>${esc(w.lga)}</td><td>${w.open}</td><td>${w.standing}</td></tr>`).join('');

  const sel = $('mediator-ward'), cur = sel.value;
  sel.innerHTML = '<option value="">All wards</option>' + d.wards.map((w) => `<option value="${w.id}">${esc(w.name)}</option>`).join('');
  sel.value = cur;
}

const load = () => fetch('/api/overview').then((r) => r.json()).then(render);
const toast = (t) => { $('toast').textContent = t; setTimeout(() => { $('toast').textContent = ''; }, 4000); };
const post = (url, body, method = 'POST') => fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }).then((r) => r.json());

document.addEventListener('click', async (e) => {
  const r = e.target.dataset.resolve, m = e.target.dataset.delMediator;
  if (r) { await post(`/api/incidents/${r}/resolve`); load(); }
  if (m) { await post(`/api/mediators/${m}`, null, 'DELETE'); load(); }
});
$('run-jobs').onclick = async () => { const r = await post('/api/jobs/run'); toast(`Reminders: ${r.harvestReminders} harvest, ${r.bookingsEnded} bookings ended, ${r.listingsExpired} listings expired`); load(); };
$('seed').onclick = async () => { const r = await post('/api/demo/seed'); toast(r.seeded ? 'Demo season loaded' : 'Demo data already loaded'); fitted = false; load(); };
for (const [id, url] of [['mediator-form', '/api/mediators'], ['ward-form', '/api/wards']]) {
  $(id).onsubmit = async (e) => {
    e.preventDefault();
    const r = await post(url, Object.fromEntries(new FormData(e.target)));
    if (r.error) return toast(r.error);
    e.target.reset(); load();
  };
}
load();
setInterval(load, 8000);
</script>
</body>
</html>
