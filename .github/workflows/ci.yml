name: Test, build and push to AT registry

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: registry.africastalking.dev/1p62rk/fieldpass

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      # Secrets come from the AT Marketplace "Registry Upload" step:
      # REGISTRY_HOST, REGISTRY_USERNAME, REGISTRY_PASSWORD
      - name: Login to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
